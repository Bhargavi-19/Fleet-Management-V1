spring.application.name=backend
spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=12345678901234567890123456789012345678901234567890
jwt.expiration=86400000

# Excel rate upload. The service rejects anything over 2 MB itself; these
# stop a huge file being buffered before it ever reaches our code.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# ---------------------------------------------------------------------
# Google Sign-In (SSO)
#
# Put the real client id / secret in application-local.properties - they are
# credentials and must not be committed. Create them at
# https://console.cloud.google.com  ->  APIs & Services  ->  Credentials
# and set the Authorised redirect URI to exactly:
#     http://localhost:8080/login/oauth2/code/google
# ---------------------------------------------------------------------
# IMPORTANT: leave these commented out until you have real credentials.
# A registration with a BLANK client-id makes Spring Security fail at startup
# with "clientId cannot be empty" - an empty value is not the same as absent.
#
# When you have them, uncomment these three lines here (or better, put them in
# application-local.properties, which is not committed):
#
#spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
#spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
#spring.security.oauth2.client.registration.google.scope=email,profile

# Where the browser is sent once Google sign-in succeeds.
app.oauth2.redirect-uri=http://localhost:5174/oauth-success

# JavaMail waits forever by default. Without these, an unreachable or slow
# SMTP server would hang the background e-mail thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
